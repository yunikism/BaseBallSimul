<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>야구 육성 시뮬레이션</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3ee;--card:#fff;--tx:#14241a;--mu:#66786d;--ac:#16a34a;--ac2:#0f7a37;--ln:#e1e8e2;--bad:#d9453a;--gd:#c98a00;--t1:#d9f5e1;--t2:#fff1c9;--sh:0 6px 20px rgba(20,60,35,.08);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1511;--card:#16211a;--tx:#e9f2ec;--mu:#8fa497;--ac:#34d070;--ac2:#1fa954;--ln:#25352b;--bad:#ff7b6e;--gd:#ffcf5a;--t1:#1d3a2a;--t2:#3a3216;--sh:0 6px 22px rgba(0,0,0,.35);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 380px at 50% -8%,var(--t1),transparent 70%),var(--bg);color:var(--tx);font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
main{max-width:480px;margin:0 auto;padding:18px 16px 40px}
h1{font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400;font-size:25px;line-height:1.25;margin:0}
h1 span{display:block;font-family:'Noto Sans KR',sans-serif;font-size:13px;margin-top:2px}
h2{font-size:16px;font-weight:700;margin:0 0 10px}
.hero{display:flex;gap:14px;align-items:center;margin:6px 0 12px}.hero>div:last-child{min-width:0}
.hero .mu{margin-top:2px}
.tile{display:grid;place-items:center;padding:10px;border-radius:20px;background:linear-gradient(135deg,var(--t1),var(--t2));border:1px solid var(--ln);box-shadow:var(--sh);flex:none}
.tile.sm{padding:6px;border-radius:14px}
.px{display:block;image-rendering:pixelated}.px.in{display:inline-block;vertical-align:-5px}
.hero .px{animation:bob 1.2s steps(2,end) infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.scene{border-radius:20px;overflow:hidden;box-shadow:var(--sh);border:1px solid var(--ln);margin:2px 0 6px;line-height:0}
.px.sc{width:100%;height:auto}
.card{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:16px;margin:12px 0;box-shadow:var(--sh);animation:up .3s ease both}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
.mu{color:var(--mu);font-size:13px}
p{margin:6px 0}
label{display:block;font-size:13px;font-weight:500;color:var(--mu);margin:12px 0 5px}
input,select{width:100%;padding:12px 14px;border:1px solid var(--ln);border-radius:14px;background:var(--bg);color:var(--tx);font:500 16px 'Noto Sans KR',sans-serif;outline:none}
input:focus,select:focus{border-color:var(--ac)}
button{padding:13px 16px;border:0;border-radius:14px;background:linear-gradient(180deg,var(--ac),var(--ac2));color:#fff;font:700 15px 'Noto Sans KR',sans-serif;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.18);transition:transform .08s}
button:active{transform:translateY(2px);box-shadow:none}
button.s{background:var(--card);color:var(--tx);border:1px solid var(--ln);box-shadow:var(--sh)}
button:disabled{opacity:.4;box-shadow:none}
button.w{width:100%;margin-top:10px}
.bar{height:10px;background:var(--ln);border-radius:6px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac2),var(--ac));border-radius:6px}
.row{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:3px 0}
.big{font-family:'Jua',sans-serif;font-size:24px;color:var(--ac)}
.up{color:var(--ac)}.dn{color:var(--bad)}.gd{color:var(--gd);font-weight:700}
ul{padding-left:18px;margin:6px 0;font-size:14px}li{margin:3px 0}
.t .row{border-bottom:1px dashed var(--ln)}.t .row:last-child{border:0}
.item{display:flex;align-items:center;gap:12px;margin-top:12px}.item .im{flex:1;font-size:14px;line-height:1.4}.item button{padding:9px 14px}
.ch{width:100%;margin-top:10px;text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--ln);box-shadow:var(--sh);padding:12px 14px;font-weight:700}.ch small{display:block;font:400 12px 'Noto Sans KR',sans-serif;color:var(--mu);margin-top:4px;line-height:1.5}.ch small b{color:var(--tx)}
.pp{position:fixed;inset:0;z-index:50;background:rgba(5,10,8,.8);display:grid;place-items:center;padding:16px;animation:fade .25s ease both;overflow:auto}
@keyframes fade{from{opacity:0}}@keyframes pop{from{opacity:0;transform:scale(.92) translateY(10px)}}
.ppb{width:100%;max-width:480px;background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .4s cubic-bezier(.2,1.3,.4,1) both}
.ppb img{display:block;width:100%;height:auto}.ppt{padding:16px 18px 18px;text-align:center}.ppt h2{font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400;font-size:26px;color:var(--gd);margin:0 0 6px}.ppt p{margin:0;font-size:14px;line-height:1.6}
.sad img{filter:saturate(.65) brightness(.88)}.sad .ppt h2{color:var(--tx)}.sad .ppt p{color:var(--mu)}
.evh{display:flex;gap:12px;align-items:center;margin-bottom:6px}.evh h2{margin:0}

var EVR=['효과: 이후 매 시즌 전 능력 성장 +0.2 (영구)','효과: 주력 스탯 2개 +2','대성공(30%) 투자금의 +80% / 무난(35%) +10% / 실패(35%) 투자금의 -60%와 전 능력 -1','효과: 팬 인기 +4','효과: 전 능력 +0.8','효과: 팬 인기 +8','진행하면 전 능력 +0.7 / 넘기면 40% 확률로 부상 악화(전 능력 -3)','효과: 전 능력 +1','효과: 영구 성장 +0.12, 팬 인기 +6'];
function adj(d,ks){(ks||Object.keys(S.st)).forEach(function(k){S.st[k]=Math.min(99,Math.max(5,S.st[k]+d))})}
function pk(a){return a[Math.floor(Math.random()*a.length)]}
var EVM=[
{n:'개인 트레이닝 센터 건립',d:'최신 장비를 갖춘 개인 트레이닝 센터를 지을 기회가 왔습니다.',c:5,once:1,f:function(){S.pb+=.2;return '센터가 완공되었습니다. 이후 매 시즌 전 능력이 조금씩 더 성장합니다. (영구 +0.2)'}},
{n:'해외 전문 코치 초빙',d:'미국의 유명 코치를 개인적으로 초빙해 집중 지도를 받을 수 있습니다.',c:3,once:1,f:function(){adj(2,S.foc);return '집중 지도를 받아 주력 스탯 '+S.foc.join('·')+'이(가) 크게 올랐습니다. (+2)'}},
{n:'지인의 투자 권유',d:'지인이 보유 자금의 절반을 투자하면 큰 수익이 난다고 권합니다. 손실 위험도 있습니다.',c:function(m){return m>=2?Math.round(m*5)/10:99},f:function(c){var r=Math.random(),g;if(r<.3){g=c*.8;S.money+=c+g;return '투자가 대성공! '+fm(g)+'의 수익을 올렸습니다.'}if(r<.65){g=c*.1;S.money+=c+g;return '무난한 수익이 났습니다. (+'+fm(g)+')'}g=c*.6;S.money+=c-g;return '투자에 실패해 '+fm(g)+'을(를) 잃었습니다. 멘탈이 흔들렸습니다. (전 능력 -1)'+(adj(-1),'')}},
{n:'모교 야구부 후원',d:'모교 야구부가 후원을 요청했습니다. 후배들과 팬들에게 좋은 이미지를 남길 수 있습니다.',c:1,f:function(){fanAdd(4);return '모교 후원이 기사화되어 팬들의 호감이 높아졌습니다. (팬 인기 +4)'}},
{n:'가족과 휴식',d:'바쁜 시즌 전, 가족과 함께 길게 쉬며 재충전할 수 있습니다.',c:1.5,f:function(){adj(.8);return '재충전을 마치고 몸과 마음이 가벼워졌습니다. (전 능력 +0.8)'}},
{n:'대규모 기부·자선 행사',d:'구단 선수회가 주관하는 자선 행사에 큰 금액을 기부할 수 있습니다.',c:function(m){return Math.max(2,Math.round(m*1)/10)},f:function(){fanAdd(8);return '팬들 사이에서 선행이 화제가 되어 이미지가 크게 올라갔습니다. (팬 인기 +8)'}},
{n:'정밀 검진·명의 수술',d:'팔꿈치·어깨에 피로가 쌓였다는 소견이 나왔습니다. 명의에게 정밀 치료를 받을 수 있습니다.',c:4,f:function(){adj(.7);return '정밀 치료를 마치고 부상 위험을 덜었습니다. (전 능력 +0.7)'},r:function(){if(Math.random()<.4){adj(-3);return '치료를 미룬 탓에 부상이 커졌습니다. (전 능력 -3)'}return '다행히 큰 문제 없이 넘어갔습니다.'}},
{n:'전력분석 전담팀 고용',d:'데이터 분석가와 영상 분석가를 개인적으로 고용할 수 있습니다.',c:2.5,once:1,f:function(){adj(1);return '분석 팀 덕분에 약점이 보완되었습니다. (전 능력 +1)'}},
{n:'야구 아카데미 설립',d:'유소년 야구 아카데미를 세워 후배를 키울 수 있습니다. 큰 투자지만 존경과 영향력을 얻습니다.',c:function(m){return Math.max(8,Math.round(m*.35))},once:1,f:function(){S.pb+=.12;fanAdd(6);return '아카데미가 문을 열었습니다. 가르치며 배우는 효과로 성장이 붙고 존경도 얻었습니다. (영구 +0.12, 팬 인기 +6)'}}];
function evc(e){return typeof e.c=='function'?e.c(S.money):e.c}
function newEv(){var pool=[];EVM.forEach(function(e,i){if(!(e.once&&S.dn.indexOf(i)>=0)&&evc(e)<=S.money)pool.push(i)});S.ev=null;if(pool.length&&Math.random()<.4){var i=pk(pool);S.ev={i:i,c:evc(EVM[i])}}}
function evCard(){if(!S.ev)return'';var e=EVM[S.ev.i];return'<div class="card" style="border-color:var(--ac)"><div class="evh"><div class="tile sm">'+px(EIC[S.ev.i],5)+'</div><h2>'+e.n+'</h2></div><p>'+e.d+'</p><p class="mu">'+EVR[S.ev.i]+'</p><div class="row"><span>필요 자금</span><b>'+fm(S.ev.c)+'</b></div><button class="ch" onclick="evGo(1)">진행하기<small>필요 자금 '+fm(S.ev.c)+'</small></button><button class="ch" onclick="evGo(0)">넘어가기<small>자금을 쓰지 않고 다음 기회로 넘깁니다.</small></button></div>'}
function evGo(y){var e=EVM[S.ev.i],c=S.ev.c,m;if(y&&S.money<c)y=0;if(y){S.money-=c;m=e.f(c);if(e.once)S.dn.push(S.ev.i)}else m=e.r?e.r():'다음 기회로 넘겼습니다.';S.ev=null;S.msg=m;home()}
function adv(){S.year++;S.age++;if(S.stage!='pro')S.grade++;S.ev=null;if(S.stage=='pro'&&S.mil!='sang'&&S.mil!='army')newEv();newShop();home()}
function annual(){S.co=Math.round(sf()*R(.92,1.08)*100)/100;S.asked=0;showCo('')}
function contract(){
 var L=Math.min(3,S.cEnd-S.py-1);
 if(S.py>=3&&S.last>=60&&L>=2&&Math.random()<.4){var y=Math.round(sf()*R(1.5,1.9)*10)/10,sg=Math.round(y*7)/10,op=Math.round(y*3)/10;
  return show('<h1>비FA 다년계약 제안</h1><p class="mu">구단이 활약을 높이 평가해 FA 전에 먼저 장기 계약을 제안했습니다.</p><div class="card"><b>'+S.team+'</b><div class="row"><span>계약금</span><b>'+fm(sg)+'</b></div><div class="row"><span>연봉 ('+L+'년)</span><b>'+fm(y)+'</b></div><div class="row"><span>성적 옵션 (연)</span><b>'+fm(op)+'</b></div><p class="mu">옵션 조건: 시즌 평가 '+(Math.round(S.last)+1)+' 이상</p><button class="w" onclick="signExt('+y+','+sg+','+op+','+L+')">다년계약 체결</button></div><button class="w s" onclick="annual()">매년 협상하기</button>')}
 annual();
}
function signExt(y,sg,op,L){S.sal=y;S.money+=sg;S.earn+=sg;S.opt={a:op,t:Math.round(S.last)+1};S.fixed=true;S.fEnd=S.py+L;S.awd.push(S.year+' 비FA 다년계약 ('+S.team+')');adv()}
function showCo(m){
 show('<h1>'+S.year+' 연봉 협상</h1><p class="mu">구단이 올 시즌 성적을 바탕으로 내년 연봉을 제시했습니다.</p><div class="card"><div class="row"><span>시즌 평가</span><b>'+Math.round(S.last)+'</b></div><div class="row"><span>현재 연봉</span><b>'+fm(S.sal)+'</b></div><div class="row"><span>구단 제시액</span><span class="big">'+fm(S.co)+'</span></div>'+(m?'<p>'+m+'</p>':'')+'</div><button class="w" onclick="S.sal=S.co;adv()">수락하고 도장 찍기</button>'+(S.asked?'':'<button class="w s" onclick="ask()">15% 더 요구하기</button>'));
}
function ask(){S.asked=1;if(Math.random()<.55){S.co=Math.round(S.co*1.15*100)/100;showCo('구단이 요구를 받아들였습니다.')}else{S.co=Math.round(S.co*.95*100)/100;showCo('구단이 난색을 보이며 제시액을 낮췄습니다.')}}
function draft(){
 var rdc=rivalDraft(S.stage=='univ');var sc=S.last*.6+ovr()*.4,n=Math.max(1,Math.round((60-sc)*4+5+R(0,10))),second=S.stage=='univ';
 if(n>110&&!second){S.stage='univ';S.grade=1;S.year++;S.age++;return show('<h1>'+(S.year-1)+' 신인 드래프트</h1><div class="card"><p>끝내 이름이 불리지 않았습니다. 하지만 야구는 끝나지 않았습니다.</p><p class="mu">대학에 진학해 4년 뒤 다시 도전합니다.</p></div>'+rdc+'<button class="w" onclick="home()">대학 진학</button>')}
 if(n>110)n=Math.round(R(98,110));
 var o=T.slice().sort(function(){return Math.random()-.5}),r=Math.ceil(n/10),p=(n-1)%10+1,bn=n<=10?3:n<=30?1.5:n<=60?.6:.2;
 S.team=o[p-1];S.stage='pro';S.trust=50;S.abr='';S.kteam='';S.fail=0;S.abDone=0;S.py=0;S.cEnd=8;S.fixed=false;S.sal=.33;S.money=bn;S.car={};S.cbt={};S.year++;S.age=second?23:19;S.grp=S.pos;S.pos=posBest(S.pos);S.pcy=S.year;
 var cm=n<=3?'전체 최상위 지명! 구단의 미래로 평가받습니다.':n<=20?'1라운드급 대형 신인입니다.':n<=60?'가능성을 인정받은 중상위 지명입니다.':'하위 순번이지만 기회는 열려 있습니다.';
 show('<h1>'+(S.year-1)+' KBO 신인 드래프트</h1><div class="card"><div class="mu">'+esc(S.name)+' · '+S.school+(second?' → 대학':'')+'</div><div class="big">'+r+'라운드 '+p+'순위</div><p>전체 '+n+'번 · <b>'+S.team+'</b> 지명</p><p class="mu">구단 성향: '+TL[TS[S.team]]+'</p><div class="row"><span>배정 포지션</span><b>'+S.pos+'</b></div><p>'+cm+'</p><div class="row"><span>계약금</span><b>'+fm(bn)+'</b></div><div class="row"><span>첫해 연봉</span><b>'+fm(.33)+'</b></div></div>'+rdc+'<button class="w" onclick="home()">프로 생활 시작</button>');
}
function fa(){
 S.opt=null;var L=S.age<=31?4:S.age<=34?3:S.age<=36?2:1;
 var o=T.filter(function(t){return t!=S.team}).sort(function(){return Math.random()-.5}).slice(0,2);o.unshift(S.team);
 var ty=[['안정형',1,.6,.1],['인센티브형',.75,.4,.5],['계약금형',.85,1.5,.1]].sort(function(){return Math.random()-.5}),th=Math.round(S.last)+1;
 var h=o.map(function(t,i){var b=sf()*R(1,1.5),k=ty[i],y=Math.max(.5,Math.round(b*k[1]*10)/10),sg=Math.round(b*k[2]*10)/10,op=Math.round(b*k[3]*10)/10;
  return'<div class="card"><b>'+t+(t==S.team?' (현 소속팀)':'')+' · '+k[0]+'</b><div class="mu">구단 성향: '+TL[TS[t]]+'</div><div class="row"><span>계약금</span><b>'+fm(sg)+'</b></div><div class="row"><span>연봉 ('+L+'년)</span><b>'+fm(y)+'</b></div><div class="row"><span>성적 옵션 (연)</span><b>'+fm(op)+'</b></div><p class="mu">보장 '+fm(sg+y*L)+' · 옵션 포함 최대 '+fm(sg+y*L+op*L)+'<br>옵션 조건: 시즌 평가 '+th+' 이상</p><button class="w" onclick="signFa(\''+t+'\','+y+','+sg+','+op+','+th+','+L+')">계약하기</button></div>'}).join('');
 show('<h1>FA 자격 취득</h1><p class="mu">'+S.py+'시즌을 채워 FA 권리를 얻었습니다. 계약금·연봉·성적 옵션이 다른 제안이 도착했습니다.</p>'+h+'<button class="w s" onclick="S.cEnd=S.py+1;S.fixed=false;contract()">이번에는 FA 신청 안 함</button>');
}
function signFa(t,y,sg,op,th,L){if(t!=S.team){S.tstay=0;S.tpf=0;S.tAw=0;S.trust=50;fanAdd(-4)}S.team=t;S.sal=y;S.money+=sg;S.earn+=sg;S.opt={a:op,t:th};S.fixed=true;S.cEnd=S.py+(L||4);S.fEnd=0;S.awd.push(S.year+' FA 계약 ('+t+')');adv()}
function retDec(){
 var h='<h1>시즌 후 거취</h1><p class="mu">'+S.age+'세, 프로 '+S.py+'시즌을 마쳤습니다. 시즌 평가 '+Math.round(S.last)+', 종합 능력 '+Math.round(ovr())+'.</p>';
 if(S.last<(S.age>=38?54:50))return show(h+'<div class="card"><p>'+S.team+' 구단이 은퇴를 권고했습니다. 재계약 의사는 없다고 합니다.</p><p class="mu">다른 팀이 나를 필요로 하는지 알아볼 수도 있고, 명예롭게 은퇴할 수도 있습니다.</p></div><button class="w" onclick="market()">다른 팀 알아보기</button><button class="w s" onclick="fin()">은퇴하기</button>');
 show(h+'<div class="card"><p>'+S.team+' 구단은 내년에도 함께하길 원합니다. 계속 뛸지, 여기서 은퇴할지 결정하세요.</p></div><button class="w" onclick="flow()">현역 연장</button><button class="w s" onclick="fin()">은퇴하기</button>');
}
function market(){
 var o=T.filter(function(t){return t!=S.team}).sort(function(){return Math.random()-.5}).slice(0,4),p=Math.min(.85,Math.max(.1,(S.last-35)/25)),of=[];
 o.forEach(function(t){if(Math.random()<p)of.push([t,Math.max(.33,Math.round(sf()*R(.5,.9)*100)/100)])});
 if(!of.length){S.rn2='여러 구단을 알아봤지만 영입 의사를 보이는 팀이 없어 결국 은퇴를 선택하게 되었습니다.';return fin()}
 show('<h1>FA 시장</h1><p class="mu">나를 필요로 하는 팀이 있습니다. 1년 계약 제안입니다.</p>'+of.map(function(x){return'<div class="card"><b>'+x[0]+'</b><div class="row"><span>연봉 (1년)</span><b>'+fm(x[1])+'</b></div><button class="w" onclick="signOld(\''+x[0]+'\','+x[1]+')">이적하기</button></div>'}).join('')+'<button class="w s" onclick="fin()">은퇴하기</button>');
}
function signOld(t,y){S.team=t;S.sal=y;S.opt=null;S.tstay=0;S.tpf=0;S.tAw=0;S.trust=45;S.fixed=false;S.awd.push(S.year+' 이적 ('+t+')');adv()}
function crows(c){var I=Math.round,r=S.type=='P'?[['이닝',I(c.ip)],['평균자책',(c.er*9/c.ip).toFixed(2)],['승-패',I(c.w)+'-'+I(c.l)],['세이브',I(c.sv)],['홀드',I(c.hld)],['탈삼진',I(c.k)]]:[['경기',I(c.g)],['타율',(c.h/c.ab).toFixed(3).slice(1)],['안타',I(c.h)],['홈런',I(c.hr)],['타점',I(c.rbi)],['도루',I(c.sb)]];return r.map(function(x){return'<div class="row"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>'}).join('')}
function fin(){
 var c=S.car,aw=S.awd.filter(function(a){return a.indexOf('FA')<0&&a.indexOf('이적')<0&&a.indexOf('진출')<0}),rn=S.tstay>=14&&S.tpf/S.tstay>=64&&S.tAw>=8&&(S.fan||0)>=50,h=S.hist.map(function(x){return'<li>'+x.y+' '+x.w+' · '+x.l+(x.r?' · '+x.r+'위, '+x.p:'')+'</li>'}).join(''),I=Math.round,cr;
 var tk=Object.keys(S.cbt),tms=tk.length>1?tk.map(function(t){var b=S.cbt[t];return'<div class="card t"><h2>'+t+' ('+b.s+'시즌)</h2>'+crows(b)+'</div>'}).join(''):'';
 show('<h1>은퇴</h1>'+(S.rn2?'<div class="card"><p>'+S.rn2+'</p></div>':'')+'<div class="card"><p>'+esc(S.name)+' (No.'+esc(S.no)+', '+S.pos+')의 야구 인생이 막을 내렸습니다.</p><div class="row"><span>마지막 소속</span><b>'+S.team+'</b></div><div class="row"><span>타고난 재능</span><b class="'+((S.tier||0)>=3?'gd':'')+'">'+(S.tier==null?'-':TN[S.tier])+'</b></div><div class="row"><span>프로 통산</span><b>'+S.py+'시즌</b></div><div class="row"><span>통산 수입</span><b>'+fm(S.earn)+'</b></div><div class="row"><span>병역</span><b>'+ML[S.mil]+'</b></div><div class="row"><span>수상</span><b>'+aw.length+'회</b></div></div>'+(rn?'<div class="card"><h2 class="gd">🎖 영구결번</h2><p>'+S.team+' 구단은 '+S.tstay+'시즌을 함께한 '+esc(S.name)+'의 등번호 '+esc(S.no)+'번을 영구결번했습니다.</p></div>':'')+tms+'<div class="card t"><h2>'+(tk.length>1?'프로 통산 (전체)':'프로 통산')+'</h2>'+crows(c)+'</div><div class="card"><h2>수상 경력</h2><ul>'+(aw.map(function(a){return'<li>'+a+'</li>'}).join('')||'<li>없음</li>')+'</ul></div>'+rivalFin()+'<div class="card"><h2>시즌 기록</h2><ul>'+h+'</ul></div><button class="w" onclick="start()">새 선수로 다시 시작</button>');PPQ=[ppOut()];ppShow();
}
start();
</script></body></html>
